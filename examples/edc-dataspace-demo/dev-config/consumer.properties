# Consumer connector configuration. Ports: 29xxx.
# See provider.properties for why hostnames are Compose service names.

edc.participant.id=example-consumer
edc.ids.id=example-consumer

edc.hostname=consumer-connector

web.http.port=29191
web.http.path=/api
web.http.management.port=29193
web.http.management.path=/management
web.http.protocol.port=29194
web.http.protocol.path=/protocol
web.http.public.port=29291
web.http.public.path=/public
web.http.control.port=29192
web.http.control.path=/control

edc.dsp.callback.address=http://consumer-connector:29194/protocol

# Where edcpy's consumer backend listens for pull credentials.
edc.receiver.http.endpoint=http://consumer-backend:28000/pull
edc.dataplane.token.validation.endpoint=http://consumer-connector:29192/control/token

edc.vault=/etc/edc/certs/vault.properties
edc.keystore=/etc/edc/certs/cert.pfx
edc.keystore.password=datacellar

# The image's entrypoint greps this key out of the properties file under
# `set -e`; without it the grep exits 1 and the connector dies silently
# before the JVM starts. generate-vault.sh then stores the API_AUTH_KEY
# environment value in the vault under this alias.
edc.api.auth.key.alias=api-auth-key

edc.public.key.alias=publickey
edc.transfer.dataplane.token.signer.privatekey.alias=datacellar
edc.transfer.proxy.token.signer.privatekey.alias=datacellar
edc.transfer.proxy.token.verifier.publickey.alias=publickey
