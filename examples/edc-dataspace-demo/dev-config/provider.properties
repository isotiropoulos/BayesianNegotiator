# Provider connector configuration.
# Ports follow the connector-building-blocks convention: provider 19xxx.
#
# Hostnames are Compose *service names*, not host.docker.internal. Both
# connectors share a Docker network, so they resolve each other directly - which
# removes the /etc/hosts workaround the upstream example needs on Linux. If you
# run the connectors on separate hosts, swap these for reachable hostnames.

edc.participant.id=example-provider
edc.ids.id=example-provider

edc.hostname=provider-connector

web.http.port=19191
web.http.path=/api
web.http.management.port=19193
web.http.management.path=/management
web.http.protocol.port=19194
web.http.protocol.path=/protocol
web.http.public.port=19291
web.http.public.path=/public
web.http.control.port=19192
web.http.control.path=/control

edc.dsp.callback.address=http://provider-connector:19194/protocol
edc.receiver.http.endpoint=http://consumer-backend:28000/pull
edc.dataplane.token.validation.endpoint=http://provider-connector:19192/control/token

# Filesystem vault + keystore, generated by dev-config/create-certs.sh and
# mounted at /etc/edc/certs. The image also reads KEYSTORE_PATH/KEYSTORE_PASSWORD
# from the environment; these properties cover the vault the env vars do not.
edc.vault=/etc/edc/certs/vault.properties
edc.keystore=/etc/edc/certs/cert.pfx
edc.keystore.password=datacellar

# The image's entrypoint greps this key out of the properties file under
# `set -e`; without it the grep exits 1 and the connector dies silently
# before the JVM starts. generate-vault.sh then stores the API_AUTH_KEY
# environment value in the vault under this alias.
edc.api.auth.key.alias=api-auth-key

edc.public.key.alias=publickey
edc.transfer.dataplane.token.signer.privatekey.alias=datacellar
edc.transfer.proxy.token.signer.privatekey.alias=datacellar
edc.transfer.proxy.token.verifier.publickey.alias=publickey

# The OpenAPI extension turns the provider's HTTP API into data space assets.
# The demo's own asset is created explicitly by seed_provider.py; this is here
# so the connector starts in its normal configuration.
eu.datacellar.openapi.url=http://provider-backend:8080/openapi.json
